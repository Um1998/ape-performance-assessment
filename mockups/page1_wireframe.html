<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Page 1 Wireframe - Executive Summary</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: auto;
        }

        /* Header */
        .header {
            height: 80px;
            background-color: #0078D4;
            color: white;
            display: flex;
            align-items: center;
            border-radius: 8px;
            margin-bottom: 20px;
            padding: 0 20px;
        }

        .logo-box {
            width: 70px;
            height: 50px;
            border: 2px dashed rgba(255,255,255,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            margin-right: 20px;
            flex-shrink: 0;
        }

        .header-title {
            font-size: 32px;
            font-weight: bold;
            flex-grow: 1;
            text-align: center;
            margin-right: 90px; /* balances the logo box so title stays visually centered */
        }

        /* Filters */
        .filter-section {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            margin-bottom: 20px;
        }

        .filter {
            width: 170px;
            height: 50px;
            border: 2px dashed #999;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            font-weight: bold;
        }

        /* KPI Strip */
        .kpi-strip {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .kpi {
            height: 100px;
            background: white;
            border: 2px solid #d9d9d9;
            border-radius: 8px;
            padding: 15px;
        }

        .kpi-title {
            font-size: 16px;
            color: #666;
        }

        .kpi-value {
            font-size: 28px;
            font-weight: bold;
            margin-top: 10px;
        }

        /* Charts */
        .chart-row {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .chart {
            background: white;
            border: 2px solid #d9d9d9;
            border-radius: 8px;
            height: 420px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 22px;
            color: #666;
            font-weight: bold;
            text-align: center;
            padding: 20px;
        }

        .note {
            margin-top: 20px;
            text-align: center;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- Header -->
    <div class="header">
        <div class="logo-box">Logo</div>
        <div class="header-title">APE Performance Report</div>
    </div>

    <!-- Filters -->
    <div class="filter-section">
        <div class="filter">Region</div>
        <div class="filter">Channel</div>
        <div class="filter">Year</div>
    </div>

    <!-- KPI Strip -->
    <div class="kpi-strip">

        <div class="kpi">
            <div class="kpi-title">APE YTD</div>
            <div class="kpi-value">###</div>
        </div>

        <div class="kpi">
            <div class="kpi-title">APE vs Target %</div>
            <div class="kpi-value">###</div>
        </div>

        <div class="kpi">
            <div class="kpi-title">Active Agents</div>
            <div class="kpi-value">###</div>
        </div>

        <div class="kpi">
            <div class="kpi-title">Persistency Rate</div>
            <div class="kpi-value">###</div>
        </div>

    </div>

    <!-- Charts -->
    <div class="chart-row">

        <div class="chart">
            Monthly APE Trend + Target Line
        </div>

        <div class="chart">
            Top 10 Agents by APE
        </div>

    </div>

</div>

</body>
</html>
